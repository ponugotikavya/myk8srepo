apiVersion : autoscaling/v2
kind : HorizontalPodAutoscaler
metadata:
  name: myproject-hpa
  spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myproject-deployment
  minReplicas: 3
  maxReplicas: 7
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50